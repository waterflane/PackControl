modLoader = "javafml"
loaderVersion = "[52,)"
license = "GNU GPL 3.0"

[[mods]]
modId = "packcontrol"
version = "${version}"
displayName = "PackControl"
authors = "waterflane"
description = '''
A client-side modpack synchronization dashboard prepared for Packwiz and GitHub integration.
'''
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "packcontrol-common.mixins.json"

[[dependencies.packcontrol]]
modId = "forge"
mandatory = true
versionRange = "[52,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.packcontrol]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"

