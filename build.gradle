import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.HexFormat

plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

configure(subprojects.findAll { it.name != 'packcontrol-publisher' }) {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

def releaseArtifactsDirectory = layout.buildDirectory.dir('release-artifacts')

tasks.register('releaseArtifacts') {
    group = 'distribution'
    description = 'Builds, tests, collects and checksums all GitHub Release assets.'

    dependsOn(
            ':common:test',
            ':packcontrol-publisher:test',
            ':common:sourcesJar',
            ':fabric:remapJar',
            ':fabric:remapSourcesJar',
            ':forge:shadowJar',
            ':forge:remapSourcesJar',
            ':neoforge:remapJar',
            ':neoforge:remapSourcesJar',
            ':packcontrol-publisher:distZip'
    )
    outputs.dir(releaseArtifactsDirectory)
    outputs.upToDateWhen { false }

    doLast {
        File destination = releaseArtifactsDirectory.get().asFile
        delete(destination)
        if (!destination.mkdirs() && !destination.isDirectory()) {
            throw new GradleException("Could not create release artifact directory: $destination")
        }

        List<File> artifacts = [
                project(':fabric').tasks.named('remapJar').get().archiveFile.get().asFile,
                project(':forge').tasks.named('shadowJar').get().archiveFile.get().asFile,
                project(':neoforge').tasks.named('remapJar').get().archiveFile.get().asFile,
                project(':common').tasks.named('sourcesJar').get().archiveFile.get().asFile,
                project(':fabric').tasks.named('remapSourcesJar').get().archiveFile.get().asFile,
                project(':forge').tasks.named('remapSourcesJar').get().archiveFile.get().asFile,
                project(':neoforge').tasks.named('remapSourcesJar').get().archiveFile.get().asFile,
                project(':packcontrol-publisher').tasks.named('distZip').get().archiveFile.get().asFile
        ]

        artifacts.each { artifact ->
            if (!artifact.isFile()) {
                throw new GradleException("Required release artifact is missing: $artifact")
            }
            Files.copy(
                    artifact.toPath(),
                    destination.toPath().resolve(artifact.name),
                    StandardCopyOption.REPLACE_EXISTING
            )
        }

        List<String> checksums = destination.listFiles()
                .findAll { it.isFile() }
                .sort { left, right -> left.name <=> right.name }
                .collect { artifact ->
                    MessageDigest digest = MessageDigest.getInstance('SHA-256')
                    artifact.withInputStream { input ->
                        byte[] buffer = new byte[16 * 1024]
                        int read
                        while ((read = input.read(buffer)) >= 0) {
                            if (read > 0) {
                                digest.update(buffer, 0, read)
                            }
                        }
                    }
                    "${HexFormat.of().formatHex(digest.digest())}  ${artifact.name}"
                }
        new File(destination, 'checksums.txt').setText(checksums.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('releaseJars') {
    group = 'distribution'
    description = 'Compatibility alias for releaseArtifacts.'
    dependsOn tasks.named('releaseArtifacts')
}
