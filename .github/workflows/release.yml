name: Draft release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble release assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer tag such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
      - name: Run tests and build release assets
        run: ./gradlew --stacktrace clean releaseArtifacts -Pmod_version="${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ steps.version.outputs.version }}
          path: build/release-artifacts/*
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts-${{ needs.build.outputs.version }}
          path: release-artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "PackControl ${GITHUB_REF_NAME#v}" \
            --generate-notes
